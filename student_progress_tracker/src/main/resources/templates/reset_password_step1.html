<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Student Tracker - Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">
    <h2>Reset Password</h2>
    <p>Enter your username and answer the security questions.</p>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <form th:action="@{/reset-password}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
        </div>
        <div class="form-group">
            <label for="answer1">What is your friend's name?</label>
            <input type="text" id="answer1" name="answer1" required />
        </div>
        <div class="form-group">
            <label for="answer2">What is the name of your first school?</label>
            <input type="text" id="answer2" name="answer2" required />
        </div>
        <div class="form-group">
            <label for="answer3">What is your pet's name?</label>
            <input type="text" id="answer3" name="answer3" required />
        </div>
        <button type="submit" class="btn-primary">Verify Answers</button>
    </form>
    <p class="link"><a th:href="@{/login}">Back to login</a></p>
</div>
</body>
</html>
