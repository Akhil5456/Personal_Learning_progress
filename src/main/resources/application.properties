# Configuration for all environments
spring.application.name=tracker

# Server port - use Railway's PORT or default to 8080
server.port=${PORT:8080}

# Database configuration - use file-based H2 for Railway
spring.datasource.url=jdbc:h2:file:./data/trackerdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Console - disable in production
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Production-ready settings
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.thymeleaf.cache=${THEMELEAF_CACHE:true}

# Logging configuration
logging.level.com.learning.tracker=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}

# Health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
