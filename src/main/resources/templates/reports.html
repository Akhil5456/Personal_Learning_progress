<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Personal Learning Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .report-section {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .report-title {
            font-size: 20px;
            font-weight: 600;
            color: white;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .summary-item {
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
        }
        .summary-item .value {
            font-size: 28px;
            font-weight: 700;
            color: #10b981;
            margin-bottom: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th {
            color: var(--text-secondary);
            font-size: 13px;
            text-transform: uppercase;
        }
        td { color: white; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1000px; margin: 40px auto;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2>Learning Reports</h2>
            <a th:href="@{/dashboard}" class="btn" style="background: rgba(255,255,255,0.1); width: auto;">Back to Dashboard</a>
        </div>

        <!-- Overall Summary -->
        <div class="report-section">
            <div class="report-title">Overall Summary</div>
            <div class="summary-grid">
                <div class="summary-item">
                    <div class="value" th:text="${totalSubjects}">0</div>
                    <div style="color: var(--text-secondary); font-size: 14px;">Total Subjects</div>
                </div>
                <div class="summary-item">
                    <div class="value" th:text="${completionPercentage} + '%'" style="color: #3b82f6;">0%</div>
                    <div style="color: var(--text-secondary); font-size: 14px;">Overall Completion</div>
                </div>
                <div class="summary-item">
                    <div class="value" th:text="${totalStudyMinutes} + ' min'" style="color: #8b5cf6;">0</div>
                    <div style="color: var(--text-secondary); font-size: 14px;">Total Study Time</div>
                </div>
            </div>
        </div>

        <!-- Subject Progress Report -->
        <div class="report-section">
            <div class="report-title">Subject Progress Report</div>
            <table>
                <thead>
                    <tr>
                        <th>Subject Name</th>
                        <th>Total Topics</th>
                        <th>Completed</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="subject : ${subjects}">
                        <td th:text="${subject.name}"></td>
                        <td th:text="${subject.topics.size()}"></td>
                        <td th:text="${subject.topics.?[status == 'Completed'].size()}"></td>
                        <td>
                            <span th:if="${subject.topics.size() > 0 && subject.topics.size() == subject.topics.?[status == 'Completed'].size()}" style="color: #10b981;">Complete</span>
                            <span th:unless="${subject.topics.size() > 0 && subject.topics.size() == subject.topics.?[status == 'Completed'].size()}" style="color: #f59e0b;">In Progress</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>
</html>
