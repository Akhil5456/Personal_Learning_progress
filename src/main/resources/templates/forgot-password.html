<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Personal Learning Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2>Recover Password</h2>
        <p class="subtitle">Answer security questions to reset your password</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/forgot-password/verify}" method="post">
            
            <div class="form-group">
                <label for="username">Enter your Username</label>
                <input type="text" id="username" name="username" class="form-control" required autocomplete="off">
            </div>

            <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.1); margin: 20px 0;">

            <div class="form-group">
                <label for="friendName">1. What is your first friend's name?</label>
                <input type="text" id="friendName" name="friendName" class="form-control" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="schoolName">2. What is the name of your first school?</label>
                <input type="text" id="schoolName" name="schoolName" class="form-control" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="petName">3. What is your pet name?</label>
                <input type="text" id="petName" name="petName" class="form-control" required autocomplete="off">
            </div>

            <button type="submit" class="btn">Verify Answers</button>
        </form>

        <div class="links" style="justify-content: center; margin-top: 20px;">
            <a th:href="@{/login}">Back to Sign In</a>
        </div>
    </div>
</body>
</html>
