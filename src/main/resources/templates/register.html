<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Personal Learning Tracker</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="max-width: 600px; margin: 40px 0;">
        <h2>Create Account</h2>
        <p class="subtitle">Join Personal Learning Tracker</p>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required>
                </div>
            </div>

            <hr style="border: 0; height: 1px; background: rgba(255,255,255,0.1); margin: 20px 0;">
            <p style="font-size: 14px; font-weight: 600; color: var(--text-secondary); margin-bottom: 16px;">Security Questions</p>

            <div class="form-group">
                <label for="friendName">1. What is your first friend's name?</label>
                <input type="text" id="friendName" th:field="*{friendName}" class="form-control" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="schoolName">2. What is the name of your first school?</label>
                <input type="text" id="schoolName" th:field="*{schoolName}" class="form-control" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="petName">3. What is your pet name?</label>
                <input type="text" id="petName" th:field="*{petName}" class="form-control" required autocomplete="off">
            </div>

            <button type="submit" class="btn">Sign Up</button>
        </form>

        <div class="links" style="justify-content: center; margin-top: 20px;">
            <a th:href="@{/login}">Already have an account? Sign In</a>
        </div>
    </div>
</body>
</html>
