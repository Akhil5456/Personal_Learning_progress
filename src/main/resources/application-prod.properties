# Production Configuration
spring.application.name=tracker

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration (PostgreSQL example - replace with your preferred database)
# Uncomment and configure for production database
# spring.datasource.url=jdbc:postgresql://localhost:5432/tracker_db
# spring.datasource.username=tracker_user
# spring.datasource.password=secure_password
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# For now, using H2 file-based database for simplicity
spring.datasource.url=jdbc:h2:file:./data/trackerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=secure_password_change_me
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# JPA Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

# H2 Console (disable in production)
spring.h2.console.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML

# Logging Configuration
logging.level.root=WARN
logging.level.com.learning.tracker=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Management endpoints (for health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

# Security Headers
security.headers.frame-options=DENY
security.headers.content-type-options=nosniff
security.headers.xss-protection=1; mode=block

# File Upload (if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
